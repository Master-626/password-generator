name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.8 is not available on the latest Ubuntu runner image.
          - python-version: "3.8"
            os: ubuntu-22.04
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.14"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and tests
        run: python -m pip install ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Check installed commands
        run: |
          password-generator --help
          passgen --version
