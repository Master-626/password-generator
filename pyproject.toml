[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "password-generator"
version = "0.1.0"
description = "A secure password generator with strength checking and batch generation support"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
keywords = ["password", "generator", "security", "cli", "strength"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.scripts]
password-generator = "password_generator.cli:main"
passgen = "password_generator.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/Master-626/password-generator"
Repository = "https://github.com/Master-626/password-generator"
Issue-Tracker = "https://github.com/Master-626/password-generator/issues"
